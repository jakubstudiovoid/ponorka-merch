<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ponorka Merch</title>
    <meta name="description" content="Merch Bar Ponorka. Rock music bar." />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Syne:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #000;
        --fg: #f4f0e8;
        --muted: #8a8175;
        --accent: #c41e1e;
        --sans: "Syne", system-ui, sans-serif;
        --display: "Pirata One", serif;
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      body { margin: 0; background: var(--bg); }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      ::selection { background: var(--accent); color: var(--fg); }
      header {
        position: fixed; inset: 0 0 auto 0; z-index: 30;
        display: flex; align-items: center; justify-content: space-between;
        padding: 1.25rem 1.5rem;
      }
      @media (min-width: 768px) { header { padding: 1.25rem 2.5rem; } }
      .brand { display: flex; align-items: center; gap: 0.75rem; }
      .brand img { height: 2rem; width: 2rem; user-select: none; }
      .kicker { font-size: 11px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; }
      nav { display: none; align-items: center; gap: 1.25rem; }
      @media (min-width: 768px) { nav { display: flex; } }
      nav button { padding: 0.25rem; font-size: 11px; letter-spacing: 0.2em; color: var(--muted); transition: color 500ms; }
      nav button.on, nav button:hover { color: var(--fg); }
      section, footer {
        min-height: 100svh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 6rem 1.5rem; text-align: center;
      }
      .reveal { opacity: 0; transform: translateY(22px); transition: opacity 900ms cubic-bezier(0.22,1,0.36,1), transform 900ms cubic-bezier(0.22,1,0.36,1); }
      .reveal.in { opacity: 1; transform: none; }
      .hero-logo { height: 7rem; width: 7rem; margin-bottom: 2rem; user-select: none; }
      @media (min-width: 768px) { .hero-logo { height: 9rem; width: 9rem; } }
      h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 3rem; line-height: 1; }
      @media (min-width: 768px) { h1 { font-size: 4.5rem; } }
      .sub { margin: 1.5rem 0 0; font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--muted); }
      .more { margin-top: 4rem; padding: 0.5rem; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); transition: color 500ms; }
      .more:hover { color: var(--fg); }
      .num { margin: 0 0 1.5rem; font-size: 11px; letter-spacing: 0.36em; text-transform: uppercase; color: var(--accent); }
      .shot { padding: 0; }
      .shot img { max-height: 68svh; max-width: 100%; width: auto; object-fit: contain; transition: transform 700ms ease; }
      @media (min-width: 768px) { .shot img { max-height: 74svh; } }
      .shot:hover img { transform: scale(1.015); }
      h2 { margin: 2rem 0 0; font-size: 1.125rem; font-weight: 500; letter-spacing: 0.08em; }
      @media (min-width: 768px) { h2 { font-size: 1.25rem; } }
      .note { margin: 0.5rem 0 0; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
      footer { min-height: 70svh; }
      footer img { height: 2.5rem; width: 2.5rem; margin-bottom: 1.5rem; }
      footer p { margin: 0; font-size: 11px; letter-spacing: 0.36em; text-transform: uppercase; color: var(--muted); }
      footer a { margin-top: 1rem; font-size: 0.875rem; letter-spacing: 0.12em; transition: color 500ms; }
      footer a:hover { color: var(--accent); }
      .lightbox {
        position: fixed; inset: 0; z-index: 50; display: none;
        align-items: center; justify-content: center; padding: 1rem;
        background: rgba(0,0,0,0.95);
      }
      .lightbox.open { display: flex; }
      .lightbox img { max-height: 88svh; max-width: 100%; object-fit: contain; }
      .close {
        position: absolute; top: 1.25rem; right: 1.5rem;
        font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted);
      }
      .close:hover { color: var(--fg); }
      @media (prefers-reduced-motion: reduce) {
        .reveal, .reveal.in { opacity: 1; transform: none; transition: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <button class="brand" id="home" aria-label="Na začátek">
        <img src="merch/logo.webp" alt="" draggable="false" />
        <span class="kicker">Merch</span>
      </button>
      <nav id="nav" aria-label="Kusy"></nav>
    </header>

    <main id="main"></main>

    <div class="lightbox" id="light" role="dialog" aria-modal="true">
      <button class="close" id="close">Zavřít</button>
      <img id="light-img" alt="" draggable="false" />
    </div>

    <script>
      const pieces = [
        { id: "01", src: "merch/01-lets-drink.webp", title: "F*ck it, let's drink", note: "Tričko" },
        { id: "02", src: "merch/02-rocknroll.webp", title: "It's only rock'n'roll, baby", note: "Tričko" },
        { id: "03", src: "merch/03-drink-now.webp", title: "Drink now, die later", note: "Tričko" },
        { id: "04", src: "merch/04-seal.webp", title: "The seal", note: "Tričko" },
        { id: "05", src: "merch/05-setlist.webp", title: "Setlist", note: "Tričko" },
        { id: "06", src: "merch/06-depth.webp", title: "Depth", note: "Tričko" },
      ];

      const main = document.getElementById("main");
      const nav = document.getElementById("nav");
      const sections = [];

      const intro = document.createElement("section");
      intro.className = "reveal";
      intro.dataset.index = "0";
      intro.innerHTML = `
        <img class="hero-logo" src="merch/logo.webp" alt="Ponorka" draggable="false" />
        <h1>Merch</h1>
        <p class="sub">Rock music bar</p>
        <button class="more" id="start">Prohlédnout</button>
      `;
      main.appendChild(intro);
      sections.push(intro);

      pieces.forEach((piece, i) => {
        const section = document.createElement("section");
        section.className = "reveal";
        section.dataset.index = String(i + 1);
        section.innerHTML = `
          <p class="num">${piece.id}</p>
          <button class="shot" aria-label="Zvětšit ${piece.title}">
            <img src="${piece.src}" alt="${piece.title}" draggable="false" />
          </button>
          <h2>${piece.title}</h2>
          <p class="note">${piece.note}</p>
        `;
        section.querySelector(".shot").addEventListener("click", () => open(i));
        main.appendChild(section);
        sections.push(section);

        const btn = document.createElement("button");
        btn.textContent = piece.id;
        btn.addEventListener("click", () => go(i + 1));
        nav.appendChild(btn);
      });

      const foot = document.createElement("footer");
      foot.className = "reveal";
      foot.dataset.index = String(pieces.length + 1);
      foot.innerHTML = `
        <img src="merch/logo.webp" alt="" draggable="false" />
        <p>Bar Ponorka</p>
        <a href="https://www.barponorka.cz">www.barponorka.cz</a>
      `;
      main.appendChild(foot);
      sections.push(foot);

      function go(i) {
        sections[i]?.scrollIntoView({ behavior: "smooth" });
      }

      const light = document.getElementById("light");
      const lightImg = document.getElementById("light-img");
      function open(i) {
        lightImg.src = pieces[i].src;
        lightImg.alt = pieces[i].title;
        light.classList.add("open");
      }
      function close() { light.classList.remove("open"); }

      document.getElementById("home").addEventListener("click", () => go(0));
      document.getElementById("start").addEventListener("click", () => go(1));
      document.getElementById("close").addEventListener("click", close);
      light.addEventListener("click", (e) => { if (e.target === light) close(); });

      let active = 0;
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("in");
          active = Number(entry.target.dataset.index);
          [...nav.children].forEach((btn, i) => btn.classList.toggle("on", i + 1 === active));
        });
      }, { threshold: 0.45 });
      sections.forEach((s) => io.observe(s));

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") close();
        if (e.key === "ArrowDown" || e.key === "ArrowRight") go(Math.min(sections.length - 1, active + 1));
        if (e.key === "ArrowUp" || e.key === "ArrowLeft") go(Math.max(0, active - 1));
      });
    </script>
  </body>
</html>
